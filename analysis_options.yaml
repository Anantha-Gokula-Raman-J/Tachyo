# No external lint package (license policy: only MIT/Apache third-party deps).
analyzer:
  exclude:
    - build/**
    - android/**
    - windows/**
  language:
    strict-casts: true
    strict-raw-types: true
linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_final_fields
    - unawaited_futures
    - cancel_subscriptions
